name: burnout
description: "Build a better you, one rep at a time."
publish_to: "none"
version: 0.2.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Core ---
  provider: ^6.1.2
  # 🟢 FIX: Matching the version pinned by your Flutter SDK
  intl: ^0.20.2

  collection: ^1.19.0 # Bumped to latest stable
  uuid: ^4.5.1 # Bumped to latest stable

  # --- Data & Network ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  http: ^1.2.2
  path_provider: ^2.1.4
  path: ^1.9.0
  sqflite: ^2.3.3 # Kept since your original file had it (even if using Hive)
  connectivity_plus: ^7.0.0

  # --- UI & Animation ---
  animations: ^2.0.11
  fl_chart: ^1.1.1
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  numberpicker: ^2.1.2
  json_theme: ^11.0.0
  home_widget: ^0.9.0 # Adjusted for compatibility
  flutter_slidable: ^3.1.1

  # --- Utilities ---
  url_launcher: ^6.3.0
  permission_handler: ^12.0.1
  package_info_plus: ^9.0.0
  file_picker: ^10.3.8
  timezone: ^0.11.0
  flutter_timezone: ^5.0.1

  # --- Additional ---
  xml: ^6.5.0
  flutter_gen: ^5.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/standardized_exercises.json
    - assets/themes/
    - assets/data/images/
    - assets/data/images/medals/
    # - assets/data/images/backgrounds/
